name: tests

# Runs the pytest suite on every push and pull request. Tests are designed
# to be hermetic (HTML fixtures cached under tests/fixtures/, no network
# access) so the workflow completes in seconds.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor (requires-python, .python-version) and the latest
        # supported release (#34).
        python-version: ["3.11", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Sync deps (the default `dev` group brings pytest + ruff)
        run: uv sync

      - name: Lint (ruff)
        # Rules are configured in pyproject.toml [tool.ruff].
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        # Run `uv run ruff format .` before pushing; the one-time reformat is in .git-blame-ignore-revs.
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest -v --tb=short

      - name: Reconcile committed CSVs against the originals
        # Top-line and contest × candidate totals, plus duplicate-key and
        # mixed-contest checks (#34, #35). Read-only; fails on any mismatch.
        if: matrix.python-version == '3.11'
        run: uv run python -m scripts.reconcile --check
